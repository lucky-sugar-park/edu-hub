spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:mariadb://localhost:3306/eduhub
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

eduhub:
  auth:
    # 키가 없으면 무작위 키로 기동한다(개발용). 운영 프로필에서는 켜지 않는다
    allow-random-key: true

logging:
  level:
    org.hibernate.SQL: debug

server.port: 8085
