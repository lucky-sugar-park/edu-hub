# 로컬 MariaDB의 전용 스키마를 쓴다. dev 스키마(eduhub)와 섞지 않는다.
spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:mariadb://localhost:3306/eduhub_test
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
eduhub:
  admin:
    # 리터럴로 둔다. .env로는 덮이지 않지만 OS 환경 변수 EDUHUB_ADMIN_EMPLOYEE_IDS는 덮을 수 있어, 관리자 목록에 기대는 테스트는 값을 테스트에서 고정한다
    employee-ids: TEST-ADMIN
