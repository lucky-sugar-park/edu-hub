spring:
  application:
    name: eduhub
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 100
eduhub:
  auth:
    # Base64 인코딩 32바이트 이상. 값은 환경 변수로만 준다. 비어 있으면 allow-random-key가 true인 프로필(dev·test)에서만 무작위 키로 기동한다(D-33)
    jwt-secret: ${EDUHUB_JWT_SECRET:}
    token-ttl: 60m
    allow-random-key: false
  # 화면 파일 폴더 (jar 밖). 기본은 프로젝트 루트의 run/web (backend 폴더에서 실행할 때 ../run/web).
  # 다른 곳을 쓰려면 환경 변수 EDUHUB_WEB_ROOT, 화면 서비스를 끄려면 EDUHUB_WEB_ROOT를 빈 값으로
  web-root: ${EDUHUB_WEB_ROOT:../run/web}
